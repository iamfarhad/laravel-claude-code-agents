name: Bootstrap CES source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact audited source
        run: |
          set -euo pipefail
          test -f .bootstrap/source.tar.gz
          tar -xzf .bootstrap/source.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify restored source
        run: |
          set -euo pipefail
          python3 tools/package_integrity.py --check
          php scripts/claude/checks/self-check.php
          python3 -S scripts/claude/tests/test_system.py
      - name: Commit verified source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: publish Claude Engineering System v3.2 source"
          git push origin HEAD:main
